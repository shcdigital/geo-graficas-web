# .gitlab-ci.yml
# Publica el sitio Astro en GitLab Pages.
# Regla de GitLab Pages: el job debe llamarse "pages" y el artefacto debe
# quedar en la carpeta "public/". Astro compila a "dist/", así que aquí se
# copia dist/ → public/ (patrón canónico de GitLab Pages).

image: node:20

stages:
  - deploy

# Caché de npm keyed por lockfile: ahorra minutos de ejecutor compartido
# (npm ci reinstala desde la caché local .npm/ en vez de re-descargar).
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - npm run build
    - "mkdir -p public && cp -r dist/* public/"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'